name: Test generator config file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a dummy config file for testing
        run: |
          echo '{}' > /tmp/next.config.js
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          static_site_generator: next
          generator_config_file: /tmp/next.config.js
        continue-on-error: true
      - name: Assert action ran with generator_config_file input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action executed with generator_config_file input"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
