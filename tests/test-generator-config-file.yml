name: Test generator config file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy config file
        run: |
          echo '{}' > nuxt.config.js
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          static_site_generator: nuxt
          generator_config_file: nuxt.config.js
        continue-on-error: true
      - name: Assert action ran with generator_config_file input
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action may fail due to API limitations in test environment,
          # but it should have run (not skipped)
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with generator_config_file=nuxt.config.js, outcome=${{ steps.action.outcome }}"
