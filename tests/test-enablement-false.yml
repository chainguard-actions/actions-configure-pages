name: Test enablement false (default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: pages
        uses: .
        with:
          token: ${{ github.token }}
          enablement: 'false'
        continue-on-error: true

      - name: Assert action ran with enablement=false
        env:
          OUTCOME: ${{ steps.pages.outcome }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          ORIGIN: ${{ steps.pages.outputs.origin }}
          HOST: ${{ steps.pages.outputs.host }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "base_url: $BASE_URL"
          echo "origin: $ORIGIN"
          echo "host: $HOST"
          echo "base_path: $BASE_PATH"

          if [ "$OUTCOME" = "success" ]; then
            # Pages is enabled for this repo — verify outputs
            if [ -z "$BASE_URL" ]; then
              echo "FAIL: base_url should not be empty when action succeeds"
              exit 1
            fi
            case "$BASE_URL" in
              https://*)
                echo "PASS: base_url has https:// prefix"
                ;;
              *)
                echo "FAIL: base_url does not start with https://"
                exit 1
                ;;
            esac
            echo "PASS: enablement=false accepted and outputs are well-formed"
          elif [ "$OUTCOME" = "failure" ]; then
            # Pages not enabled — action should fail without trying to enable it
            echo "INFO: Pages not enabled and enablement=false, action correctly did not enable Pages"
            echo "PASS: action ran with enablement=false and produced a deterministic outcome"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
