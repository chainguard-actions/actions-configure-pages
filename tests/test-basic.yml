name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          enablement: 'false'
        continue-on-error: true
      - name: Assert action ran and produced outputs or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BASE_URL: ${{ steps.action.outputs.base_url }}
          ORIGIN: ${{ steps.action.outputs.origin }}
          HOST: ${{ steps.action.outputs.host }}
          BASE_PATH: ${{ steps.action.outputs.base_path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "base_url: $BASE_URL"
          echo "origin: $ORIGIN"
          echo "host: $HOST"
          echo "base_path: $BASE_PATH"
          # The action either succeeds (Pages is configured) or fails with an API error
          # Both are acceptable outcomes in the act environment
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran to completion with outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
