name: Test nuxt static site generator
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-testing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run configure-pages action with nuxt generator
        id: action
        uses: .
        with:
          token: ${{ env.GITHUB_TOKEN }}
          static_site_generator: nuxt
          enablement: 'false'
        continue-on-error: true

      - name: Assert action ran (step was attempted)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action will fail because there's no real GitHub Pages API in act,
          # but we verify it ran (outcome is either success or failure, not skipped)
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with nuxt generator (outcome=${{ steps.action.outcome }})"
